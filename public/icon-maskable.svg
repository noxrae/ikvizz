<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="champ" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e6c8"/>
      <stop offset="1" stop-color="#cbb489"/>
    </linearGradient>
    <radialGradient id="pearl" cx="0.36" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#f6efe0"/>
      <stop offset="1" stop-color="#b29a6c"/>
