# Ikvizz — Render Blueprint (free tier).
# Push this repo to GitHub, then in Render: New → Blueprint → pick the repo.
# Render reads this file and provisions everything automatically.
services:
  - type: web
    name: ikvizz
    runtime: docker
    plan: free                # $0 — see COSTS.md for what "free" includes/excludes
    healthCheckPath: /
    envVars:
      - key: JWT_SECRET        # auto-generated once, kept stable → logins survive restarts
        generateValue: true
      - key: NODE_ENV
        value: production
      # Google Sign-In (public OAuth client ID — safe to commit; not a secret).
      - key: GOOGLE_CLIENT_ID
        value: "249308384181-n0sa6fb79r2rurit7tm8fpoj362pjrbd.apps.googleusercontent.com"
      # Durable persistence: snapshot the database + media to Supabase Storage so
      # data SURVIVES redeploys and sleep. Both are project-specific secrets, so
      # Render asks you to paste them in the dashboard (sync:false → never in git).
      # Find them in Supabase → Project Settings → API (URL) and → API Keys
      # (the service_role / secret key). NODE_ENV=production above turns this on.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Optional — the Postgres mirror in cloud.js. Leave unset; the Storage
      # snapshot above already makes everything durable.
      # - key: SUPABASE_DB_URL
      #   sync: false
